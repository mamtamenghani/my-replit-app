openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/directory:
    get:
      operationId: getDirectory
      responses:
        "200":
          description: Login choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directory" }
  /auth/setup:
    post:
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminInput" }
      responses:
        "201":
          description: Admin created and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Session or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out }
  /employees:
    get:
      operationId: listEmployees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: deleteEmployee
      responses:
        "204": { description: Removed along with assigned tasks }
  /tasks:
    get:
      operationId: listTasks
      parameters:
        - { name: date, in: query, required: true, schema: { type: string } }
        - { name: employeeId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Chronologically sorted tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
    delete:
      operationId: deleteTask
      responses:
        "204": { description: Deleted }
  /tasks/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: setTaskStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /dashboard:
    get:
      operationId: getDashboard
      parameters:
        - { name: date, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Daily employee progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          description: Full completion history newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      responses:
        "204": { description: All read }
  /push/config:
    get:
      operationId: getPushConfig
      responses:
        "200":
          description: Public VAPID key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushConfig" }
  /push/subscribe:
    post:
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushInput" }
      responses:
        "204": { description: Subscribed }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    User:
      type: object
      required: [id, name, role, department, color]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [admin, employee] }
        department: { type: string }
        color: { type: string }
    Directory:
      type: object
      required: [needsSetup, users]
      properties:
        needsSetup: { type: boolean }
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }
    SessionInfo:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
    AdminInput:
      type: object
      required: [name, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginInput:
      type: object
      required: [userId, password]
      properties:
        userId: { type: integer }
        password: { type: string, minLength: 1, maxLength: 128 }
    EmployeeInput:
      type: object
      required: [name, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 4, maxLength: 128 }
        department: { type: string, maxLength: 80 }
    Task:
      type: object
      required: [id, employeeId, employeeName, title, description, date, startTime, endTime, done, completedAt]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        title: { type: string }
        description: { type: string }
        date: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        done: { type: boolean }
        completedAt: { type: [string, "null"] }
    TaskInput:
      type: object
      required: [employeeId, title, date, startTime, endTime]
      properties:
        employeeId: { type: integer }
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        startTime: { type: string, pattern: '^\d{2}:\d{2}$' }
        endTime: { type: string, pattern: '^\d{2}:\d{2}$' }
    StatusInput:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
    EmployeeProgress:
      type: object
      required: [employee, total, done]
      properties:
        employee: { $ref: "#/components/schemas/User" }
        total: { type: integer }
        done: { type: integer }
    Dashboard:
      type: object
      required: [totalTasks, doneTasks, pendingTasks, totalEmployees, employees]
      properties:
        totalTasks: { type: integer }
        doneTasks: { type: integer }
        pendingTasks: { type: integer }
        totalEmployees: { type: integer }
        employees:
          type: array
          items: { $ref: "#/components/schemas/EmployeeProgress" }
    Notification:
      type: object
      required: [id, message, employeeName, taskTitle, createdAt, read]
      properties:
        id: { type: integer }
        message: { type: string }
        employeeName: { type: string }
        taskTitle: { type: string }
        createdAt: { type: string }
        read: { type: boolean }
    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string }
    PushInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
